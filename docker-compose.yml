services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fohlio
      POSTGRES_PASSWORD: fohlio
      POSTGRES_DB: fohlio_courses
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fohlio"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3026:3026"
    environment:
      DATABASE_URL: postgresql://fohlio:fohlio@db:5432/fohlio_courses
      JWT_SECRET: change-me-in-production
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
