<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fohlio Courses">
  <!-- Rounded brand-blue tile -->
  <rect width="64" height="64" rx="14" fill="#3451B2"/>
  <!-- Graduation-cap / mortarboard motif: a thin board sitting above the F -->
  <path d="M12 18 L32 11 L52 18 L32 25 Z" fill="#fff" fill-opacity="0.28"/>
  <!-- Letter F built from clean rectangles -->
  <!-- Vertical stem -->
  <rect x="22" y="22" width="9" height="32" rx="2.5" fill="#fff"/>
  <!-- Top bar -->
  <rect x="22" y="22" width="24" height="9" rx="2.5" fill="#fff"/>
  <!-- Middle bar (shorter -> open-book / stacked-card feel) -->
  <rect x="22" y="35" width="18" height="8" rx="2.5" fill="#fff"/>
  <!-- Tassel bead, top-right of the cap -->
  <circle cx="49" cy="20" r="2.6" fill="#fff" fill-opacity="0.9"/>
</svg>
